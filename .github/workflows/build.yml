name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev libgtk-3-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        # Clippy runs and reports warnings. It is intentionally *not* gated
        # with `-D warnings` yet: the codebase carries pre-existing debt
        # (field_assignment_with_default, sort_by_key, etc.). The output is
        # the signal; fixing the debt is tracked separately. Formatting is
        # the hard gate here.
        run: cargo clippy --all-targets

  build:
    name: build-${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15, macos-15-intel]
        include:
          - os: ubuntu-latest
            artifact: pangan-linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            artifact: pangan-linux-aarch64
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            artifact: pangan-windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            artifact: pangan-windows-aarch64
            target: aarch64-pc-windows-msvc
          - os: macos-15
            artifact: pangan-macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            artifact: pangan-macos-x86_64
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev libgtk-3-dev

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.artifact }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.artifact }}-cargo-

      - name: Check
        run: cargo check --all-features --target ${{ matrix.target }}

      # Two cases skip running the suite:
      # - Windows ARM64: MSVC LNK1181 toolchain bug on aarch64 (build works).
      # - macOS x86_64 cross-compiled on the arm64 macos-latest host: the
      #   x86_64 test binary cannot be executed on Apple Silicon, so we
      #   compile-check it and skip the run.
      - name: Test
        if: matrix.artifact != 'pangan-windows-aarch64' && matrix.artifact != 'pangan-macos-x86_64'
        run: cargo test --all-features --target ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      # Give the binary a unique per-OS name so Linux/macOS artifacts
      # cannot collide in the release (both are named "pangan" by cargo).
      - name: Prepare release artifact
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ -f pangan.exe ]; then
            mv pangan.exe "${{ matrix.artifact }}.exe"
          else
            mv pangan "${{ matrix.artifact }}"
          fi

      - name: Compute SHA256
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          f="${{ matrix.artifact }}"
          if [ -f "${f}.exe" ]; then f="${f}.exe"; fi
          python3 -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest(), sys.argv[1])" "$f" > "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}
            target/${{ matrix.target }}/release/${{ matrix.artifact }}.exe
            target/${{ matrix.target }}/release/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  appimage:
    name: appimage-${{ matrix.artifact }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 AppImage built on the ubuntu-latest runner attaching the
          # x86_64 binary produced by the build job.
          - os: ubuntu-latest
            artifact: pangan-linux-x86_64
            ai_arch: x86_64
          # aarch64 AppImage built on the native arm64 runner.
          - os: ubuntu-24.04-arm
            artifact: pangan-linux-aarch64
            ai_arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin
      - name: Stage binary for packaging
        run: |
          mkdir -p target/release
          install -m 0755 bin/${{ matrix.artifact }} target/release/pangan
      - name: Build AppImage
        run: ./packaging/build-appimage.sh
      - name: Verify AppImage
        run: |
          file dist/*.AppImage
          chmod +x dist/*.AppImage
          # Basic smoke: the AppImage is a self-extracting runtime; just ensure
          # it exists, is executable and contains the AppRun + usr/bin/pangan.
          test -x dist/*.AppImage
          ls -la dist/
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: pangan-appimage-${{ matrix.ai_arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  windows-portable:
    name: windows-portable-x86_64
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: pangan-windows-x86_64
          path: bin
      - name: Stage exe for packaging
        run: |
          mkdir -p target/x86_64-pc-windows-msvc/release
          install -m 0755 bin/pangan-windows-x86_64.exe \
            target/x86_64-pc-windows-msvc/release/pangan.exe
      - name: Build portable ZIP
        run: ./packaging/build-windows-portable.sh
      - name: Verify ZIP
        run: |
          unzip -l dist/*.zip
          unzip -l dist/*.zip | grep -q Pangan.exe
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pangan-windows-portable
          path: dist/*.zip
          if-no-files-found: error

  android:
    name: android-release
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Install NDK + platform + build-tools (non-interactive)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" \
            "ndk;27.2.12479018" \
            "platforms;android-35" \
            "build-tools;35.0.0"
      - name: Install cargo-apk
        run: cargo install cargo-apk
      - name: Install apksigner
        run: sudo apt-get update && sudo apt-get install -y apksigner
      - name: Materialize stable release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/pangan.keystore"
          chmod 600 "$RUNNER_TEMP/pangan.keystore"
          keytool -list -keystore "$RUNNER_TEMP/pangan.keystore" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >/dev/null
      - name: Build release APK (arm64)
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/pangan.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: platforms/android/app
        run: |
          cargo apk build --release --target aarch64-linux-android
          mkdir -p "$GITHUB_WORKSPACE/dist/abi"
          cp "$GITHUB_WORKSPACE/target/release/apk/pangan_android.apk" \
             "$GITHUB_WORKSPACE/dist/abi/pangan-android-arm64.apk"
      - name: Build release APK (x86_64)
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/pangan.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: platforms/android/app
        run: |
          cargo apk build --release --target x86_64-linux-android
          mkdir -p "$GITHUB_WORKSPACE/dist/abi"
          cp "$GITHUB_WORKSPACE/target/release/apk/pangan_android.apk" \
             "$GITHUB_WORKSPACE/dist/abi/pangan-android-x86_64.apk"
      - name: Merge universal APK (arm64 + x86_64)
        run: |
          python3 .github/scripts/build_universal_apk.py \
            dist/pangan-android-universal-unsigned.apk \
            dist/abi/pangan-android-arm64.apk \
            dist/abi/pangan-android-x86_64.apk
      - name: Sign universal APK (v1+v2+v3)
        run: |
          java -jar /usr/share/java/apksigner.jar sign \
            --ks "$RUNNER_TEMP/pangan.keystore" \
            --ks-key-alias pangan \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }} \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out dist/pangan-android-universal.apk \
            dist/pangan-android-universal-unsigned.apk
      - name: Verify universal APK
        run: |
          set -euo pipefail
          java -jar /usr/share/java/apksigner.jar verify --verbose dist/pangan-android-universal.apk
          unzip -l dist/pangan-android-universal.apk | grep -q 'lib/arm64-v8a/libpangan_android.so'
          unzip -l dist/pangan-android-universal.apk | grep -q 'lib/x86_64/libpangan_android.so'
          unzip -l dist/pangan-android-universal.apk | grep -q 'AndroidManifest.xml'
          python3 .github/scripts/verify_apk_alignment.py dist/pangan-android-universal.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pangan-android-release
          path: dist/pangan-android-universal.apk
          if-no-files-found: error

  ios-simulator:
    name: ios-simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
      - name: Build Rust staticlib for the simulator
        working-directory: platforms/ios/app
        run: cargo build -p pangan-ios --target aarch64-apple-ios-sim --release
      - name: Assemble the .app bundle
        run: |
          set -euo pipefail
          APP="build/pangan-ios-simulator.app"
          rm -rf "$APP" && mkdir -p "$APP"
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          LIB="target/aarch64-apple-ios-sim/release/libpangan_ios.a"
          test -f "$LIB" || { echo "missing $LIB"; exit 1; }
          xcrun clang -arch arm64 -std=c11 \
            -isysroot "$SDK" -mios-simulator-version-min=13.0 \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -framework QuartzCore -framework Metal -framework MetalKit \
            -framework CoreText -framework WebKit -framework ImageIO \
            -lobjc -lc++ \
            -Wl,-no_compact_unwind -Wl,-all_load \
            -o "$APP/pangan" \
            "$LIB" \
            -lpthread -lm -ldl
          test -x "$APP/pangan" || { echo "executable missing"; exit 1; }
          cp platforms/ios/Info.plist.in "$APP/Info.plist"
          file "$APP/pangan"
      - name: Verify bundle (plutil + ad-hoc codesign)
        run: |
          set -euo pipefail
          plutil -lint build/pangan-ios-simulator.app/Info.plist
          codesign --force --sign - --deep build/pangan-ios-simulator.app
          codesign --verify --deep --strict build/pangan-ios-simulator.app
      - name: Package bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd build && zip -r -X ../dist/pangan-ios-simulator.app.zip pangan-ios-simulator.app)
          ls -la dist/
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: pangan-ios-simulator
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: release
    needs: [build, android, ios-simulator, appimage, windows-portable]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add install helpers
        run: |
          cp packaging/install.sh dist/install.sh
          chmod +x dist/install.sh
          cp packaging/pangan.desktop dist/pangan.desktop
      - name: List artifacts
        run: find dist -type f | sort
      - name: Generate release notes + checksums
        run: python3 .github/scripts/generate_release_notes.py
      - name: Show generated notes
        run: |
          head -30 release_body.md
          echo '--- SHA256SUMS.txt ---'
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          fail_on_unmatched_files: true
          files: |
            dist/**
            SHA256SUMS.txt
