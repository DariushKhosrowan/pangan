name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev libgtk-3-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        # Clippy runs and reports warnings. It is intentionally *not* gated
        # with `-D warnings` yet: the codebase carries pre-existing debt
        # (field_assignment_with_default, sort_by_key, etc.). The output is
        # the signal; fixing the debt is tracked separately. Formatting is
        # the hard gate here.
        run: cargo clippy --all-targets

  build:
    name: build-${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15, macos-15-intel]
        include:
          - os: ubuntu-latest
            artifact: pangan-linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            artifact: pangan-linux-aarch64
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            artifact: pangan-windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            artifact: pangan-windows-aarch64
            target: aarch64-pc-windows-msvc
          - os: macos-15
            artifact: pangan-macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            artifact: pangan-macos-x86_64
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev libgtk-3-dev

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.artifact }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.artifact }}-cargo-

      - name: Check
        run: cargo check --all-features --target ${{ matrix.target }}

      # Two cases skip running the suite:
      # - Windows ARM64: MSVC LNK1181 toolchain bug on aarch64 (build works).
      # - macOS x86_64 cross-compiled on the arm64 macos-latest host: the
      #   x86_64 test binary cannot be executed on Apple Silicon, so we
      #   compile-check it and skip the run.
      - name: Test
        if: matrix.artifact != 'pangan-windows-aarch64' && matrix.artifact != 'pangan-macos-x86_64'
        run: cargo test --all-features --target ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      # Give the binary a unique per-OS name so Linux/macOS artifacts
      # cannot collide in the release (both are named "pangan" by cargo).
      - name: Prepare release artifact
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ -f pangan.exe ]; then
            mv pangan.exe "${{ matrix.artifact }}.exe"
          else
            mv pangan "${{ matrix.artifact }}"
          fi

      - name: Compute SHA256
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          f="${{ matrix.artifact }}"
          if [ -f "${f}.exe" ]; then f="${f}.exe"; fi
          python3 -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest(), sys.argv[1])" "$f" > "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}
            target/${{ matrix.target }}/release/${{ matrix.artifact }}.exe
            target/${{ matrix.target }}/release/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  android:
    name: android-release
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Install NDK + platform + build-tools (non-interactive)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" \
            "ndk;27.2.12479018" \
            "platforms;android-35" \
            "build-tools;35.0.0"
      - name: Install cargo-apk
        run: cargo install cargo-apk
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/pangan.keystore" \
            -storepass pangan-release -keypass pangan-release \
            -alias pangan -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Pangan, OU=Pangan, O=Pangan, L=IR, S=IR, C=IR"
      - name: Build release APK (arm64)
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/pangan.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: pangan-release
        working-directory: platforms/android/app
        run: |
          cargo apk build --release --target aarch64-linux-android
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$GITHUB_WORKSPACE/target/release/apk/pangan_android.apk" \
             "$GITHUB_WORKSPACE/dist/pangan-android-arm64.apk"
      - name: Build release APK (x86_64)
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/pangan.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: pangan-release
        working-directory: platforms/android/app
        run: |
          cargo apk build --release --target x86_64-linux-android
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$GITHUB_WORKSPACE/target/release/apk/pangan_android.apk" \
             "$GITHUB_WORKSPACE/dist/pangan-android-x86_64.apk"
      - name: Verify APKs
        run: |
          set -euo pipefail
          for apk in dist/pangan-android-arm64.apk dist/pangan-android-x86_64.apk; do
            echo "── $apk"
            unzip -l "$apk" | grep -Eq 'lib/.*/libpangan_android.so' || { echo "no native lib"; exit 1; }
            unzip -l "$apk" | grep -q 'AndroidManifest.xml' || { echo "no manifest"; exit 1; }
            unzip -l "$apk" | grep -Eq 'META-INF/.*\.(RSA|DSA|EC)' || { echo "APK not signed"; exit 1; }
          done
          unzip -l dist/pangan-android-arm64.apk | grep -Eq 'lib/arm64-v8a/libpangan_android.so' || { echo "arm64 lib missing"; exit 1; }
          unzip -l dist/pangan-android-x86_64.apk | grep -Eq 'lib/x86_64/libpangan_android.so' || { echo "x86_64 lib missing"; exit 1; }
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pangan-android-release
          path: dist/*.apk
          if-no-files-found: error

  ios-simulator:
    name: ios-simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
      - name: Build Rust staticlib for the simulator
        working-directory: platforms/ios/app
        run: cargo build -p pangan-ios --target aarch64-apple-ios-sim --release
      - name: Assemble the .app bundle
        run: |
          set -euo pipefail
          APP="build/pangan-ios-simulator.app"
          rm -rf "$APP" && mkdir -p "$APP"
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          LIB="target/aarch64-apple-ios-sim/release/libpangan_ios.a"
          test -f "$LIB" || { echo "missing $LIB"; exit 1; }
          xcrun clang -arch arm64 -std=c11 \
            -isysroot "$SDK" -mios-simulator-version-min=13.0 \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -framework QuartzCore -framework Metal -framework MetalKit \
            -framework CoreText -framework WebKit -framework ImageIO \
            -lobjc -lc++ \
            -Wl,-no_compact_unwind -Wl,-all_load \
            -o "$APP/pangan" \
            "$LIB" \
            -lpthread -lm -ldl
          test -x "$APP/pangan" || { echo "executable missing"; exit 1; }
          cp platforms/ios/Info.plist.in "$APP/Info.plist"
          file "$APP/pangan"
      - name: Verify bundle (plutil + ad-hoc codesign)
        run: |
          set -euo pipefail
          plutil -lint build/pangan-ios-simulator.app/Info.plist
          codesign --force --sign - --deep build/pangan-ios-simulator.app
          codesign --verify --deep --strict build/pangan-ios-simulator.app
      - name: Package bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd build && zip -r -X ../dist/pangan-ios-simulator.app.zip pangan-ios-simulator.app)
          ls -la dist/
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: pangan-ios-simulator
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: release
    needs: [build, android, ios-simulator]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: find dist -type f | sort
      - name: Generate release notes + checksums
        run: python3 .github/scripts/generate_release_notes.py
      - name: Show generated notes
        run: |
          head -30 release_body.md
          echo '--- SHA256SUMS.txt ---'
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          fail_on_unmatched_files: true
          files: |
            dist/**
            SHA256SUMS.txt
