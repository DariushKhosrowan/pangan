name: Mobile - Android

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android release APK (arm64 + x86_64)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install NDK + platform + build-tools (non-interactive)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # Fail hard if a required component cannot be installed — a missing
          # platform shows up later as "Platform N is not installed".
          yes | "$SDKMANAGER" \
            "ndk;27.2.12479018" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/pangan.keystore" \
            -storepass pangan-release -keypass pangan-release \
            -alias pangan -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Pangan, OU=Pangan, O=Pangan, L=IR, S=IR, C=IR"

      - name: Build release APK (arm64)
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/pangan.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: pangan-release
        working-directory: platforms/android/app
        run: |
          cargo apk build --release --target aarch64-linux-android
          # cargo-apk writes the APK to the workspace-level target dir; copy it
          # out now because the next ABI build overwrites the same path.
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$GITHUB_WORKSPACE/target/release/apk/pangan_android.apk" \
             "$GITHUB_WORKSPACE/dist/pangan-android-arm64.apk"

      - name: Build release APK (x86_64)
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/pangan.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: pangan-release
        working-directory: platforms/android/app
        run: |
          cargo apk build --release --target x86_64-linux-android
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$GITHUB_WORKSPACE/target/release/apk/pangan_android.apk" \
             "$GITHUB_WORKSPACE/dist/pangan-android-x86_64.apk"

      - name: Verify APKs (native lib + manifest + signed)
        run: |
          set -euo pipefail
          # This app is pure Rust (android.app.NativeActivity) — cargo-apk builds
          # it with aapt and produces no Java bytecode, so there is no
          # classes.dex. Verify what actually exists: the manifest, the native
          # library, and a valid v1 signature block.
          for apk in dist/pangan-android-arm64.apk dist/pangan-android-x86_64.apk; do
            echo "── $apk"
            unzip -l "$apk" | grep -Eq 'lib/.*/libpangan_android.so' || { echo "no native lib"; exit 1; }
            unzip -l "$apk" | grep -q 'AndroidManifest.xml' || { echo "no manifest"; exit 1; }
            unzip -l "$apk" | grep -Eq 'META-INF/.*\.(RSA|DSA|EC)' || { echo "APK not signed"; exit 1; }
          done
          # arm64 APK must contain the arm64-v8a lib; x86_64 the x86_64 lib.
          unzip -l dist/pangan-android-arm64.apk | grep -Eq 'lib/arm64-v8a/libpangan_android.so' || { echo "arm64 native lib missing"; exit 1; }
          unzip -l dist/pangan-android-x86_64.apk | grep -Eq 'lib/x86_64/libpangan_android.so' || { echo "x86_64 native lib missing"; exit 1; }
          ls -la dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pangan-android-release
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Attach Android APKs to release
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: pangan-android-release
          path: dist
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          update_release_body: false
          files: dist/*
