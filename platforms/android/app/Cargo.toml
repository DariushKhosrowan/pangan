[package]
name = "pangan-android"
version = "0.3.0"
edition = "2021"
publish = false
description = "Pangan — Persian Pomodoro timer for Android (hosts the shared Slint UI)"
license = "MIT"
authors = ["Dariush Khosrowan"]
repository = "https://github.com/DariushKhosrowan/pangan"

[lib]
name = "pangan_android"
crate-type = ["cdylib"]

[dependencies]
pangan = { path = "../../.." }
slint = { version = "1.11", features = ["backend-android-activity-06"] }
android-activity = "0.6"

# cargo-apk packaging metadata: https://github.com/rust-mobile/cargo-apk
# NOTE: version_name / version_code are intentionally NOT set here — cargo-apk
# derives them from the package version (and panics if they are set).
[package.metadata.android]
package = "ir.khosrowan.pangan"
label = "Pangan"
permissions = []
min_sdk_version = 24
target_sdk_version = 35
