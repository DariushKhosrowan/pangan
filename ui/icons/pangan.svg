<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Old Parsi / Achaemenid winged-disc mark for Pangan -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#242a4d"/>
      <stop offset="100%" stop-color="#171a2e"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- outer ring -->
  <circle cx="128" cy="128" r="104" fill="none" stroke="#e0b25c" stroke-width="5" opacity="0.9"/>
  <circle cx="128" cy="128" r="92" fill="none" stroke="#e0b25c" stroke-width="2" opacity="0.5"/>

  <!-- left wing: layered wedge marks -->
  <rect x="40" y="112" width="52" height="12" rx="6" fill="#e0b25c"/>
  <rect x="48" y="132" width="40" height="11" rx="5.5" fill="#e0b25c"/>
  <rect x="56" y="151" width="28" height="10" rx="5" fill="#e0b25c"/>

  <!-- right wing -->
  <rect x="164" y="112" width="52" height="12" rx="6" fill="#e0b25c"/>
  <rect x="168" y="132" width="40" height="11" rx="5.5" fill="#e0b25c"/>
  <rect x="172" y="151" width="28" height="10" rx="5" fill="#e0b25c"/>

  <!-- central flame / bull head -->
  <rect x="108" y="102" width="40" height="64" rx="14" fill="#e0b25c"/>
  <rect x="119" y="116" width="10" height="12" rx="4" fill="#171a2e"/>
  <rect x="127" y="116" width="10" height="12" rx="4" fill="#171a2e"/>

  <!-- cuneiform rays above -->
  <rect x="88" y="66" width="16" height="8" rx="4" fill="#e0b25c"/>
  <rect x="112" y="58" width="16" height="8" rx="4" fill="#e0b25c"/>
  <rect x="136" y="60" width="16" height="8" rx="4" fill="#e0b25c"/>
  <rect x="158" y="68" width="13" height="8" rx="4" fill="#e0b25c"/>

  <!-- base platform -->
  <rect x="92" y="176" width="72" height="10" rx="5" fill="#e0b25c" opacity="0.9"/>
</svg>
